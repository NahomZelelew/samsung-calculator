<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Calculator</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    
  </style>
</head>
<body>
  <section>
    <p>
      <button>C</button>
      <button class="backspace-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
      </button>
      <button>%</button>
      <button>/</button>
    </p>

    <p>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>
    </p>
  
    <p>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>
    </p>
  
    <p>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
    </p>
  
    <p>
      <button>()</button>
      <button>0</button>
      <button>.</button>
      <button>=</button>
    </p>
    
    <button>Clear</button>
</section>

  <script src="js/script.js"></script>

</body>
</html>
