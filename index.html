<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Calculator</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    
  </style>
</head>
<body>
  <section class="all">
    <p class="first-row">
      <button class="clear">C</button>
      <button class="backspace-btn">
        <svg width="20" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
      </button>
      <button class="percent">%</button>
      <button class="division">/</button>
    </p>

    <p>
      <button class="num7">7</button>
      <button class="num8">8</button>
      <button class="num9">9</button>
      <button class="multiplication">*</button>
    </p>
  
    <p>
      <button class="num4">4</button>
      <button class="num5">5</button>
      <button class="num5">6</button>
      <button class="subtruction">-</button>
    </p>
  
    <p>
      <button class="num1">1</button>
      <button class="num2">2</button>
      <button class="num3">3</button>
      <button class="addition">+</button>
    </p>
  
    <p>
      <button class="bracket">()</button>
      <button class="num0">0</button>
      <button class="point">.</button>
      <button class="equal">=</button>
    </p>
    
</section>

  <script src="js/script.js"></script>

</body>
</html>
